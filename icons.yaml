product: 微澜，面向个人使用的 HarmonyOS 微博阅读客户端
personality: [清爽, 现代, 灵动]
sizes: [18, 22, 24, 48]
dir: design/icons
avoid: [微博官方眼睛标志, 字母或数字, 复杂写实水花]
dna:
  style: outline
  stroke: 1.75
  grid: 24
  padding: 1
  keylines: { circle: 20, square: 18, portrait: [16, 20], landscape: [20, 16] }
  corners: { family: squircle, radius: { large: 5, small: 2.5 }, largeThreshold: 8 }
  caps: round
  joins: round
  angles: [0, 45, 90]
  detail: low
  minGap: 2
  badge: { position: bottom-right, size: 8, gap: 2 }
